<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Робота поруч — Знайди роботу або замов послугу у своєму районі</title>
    <style>
        :root {
            --primary-color: #1b4d3e;
            --primary-light: #2c6b56;
            --accent-color: #e67e22;
            --bg-light: #f8f9fa;
            --text-dark: #2d3748;
            --text-muted: #718096;
            --white: #ffffff;
            --border-radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
            --transition: all 0.2s ease;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.5;
            padding-bottom: 90px; /* Збільшено відступ, щоб меню не перекривало контент */
        }

        header {
            background-color: var(--white);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 65px;
        }

        .logo {
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .desktop-nav {
            display: flex;
            gap: 15px;
            list-style: none;
        }

        .desktop-nav a {
            font-weight: 500;
            color: var(--text-dark);
            text-decoration: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        .desktop-nav a.active {
            color: var(--primary-color);
            background-color: #edf2f7;
        }

        /* Мобільне меню — ВИПРАВЛЕНО ТА СТАБІЛІЗОВАНО */
        .mobile-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--white);
            box-shadow: 0 -2px 15px rgba(0,0,0,0.15);
            display: none; /* Увімкнеться на мобільних через медіа-запит */
            justify-content: space-around;
            align-items: center;
            height: 70px; /* Фіксована висота */
            z-index: 9999;
            padding: 0 10px;
        }

        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text-muted);
            text-decoration: none;
            font-weight: 500;
            background: none;
            border: none;
            cursor: pointer;
            flex: 1;
            height: 100%;
        }

        .mobile-nav-item svg {
            width: 24px;
            height: 24px;
            margin-bottom: 4px;
            fill: var(--text-muted);
            transition: var(--transition);
        }

        .mobile-nav-item.active {
            color: var(--primary-color);
        }

        .mobile-nav-item.active svg {
            fill: var(--primary-color);
        }

        /* Помаранчева кнопка по центру */
        .mobile-nav-item.center-btn {
            background-color: var(--accent-color);
            width: 56px;
            height: 56px;
            max-width: 56px;
            border-radius: 50%;
            position: relative;
            top: -15px;
            box-shadow: 0 4px 12px rgba(230, 126, 34, 0.4);
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mobile-nav-item.center-btn svg {
            width: 26px;
            height: 26px;
            fill: var(--white);
            margin-bottom: 0;
        }

        /* Секції сторінок */
        .page-section {
            display: none;
            padding: 20px 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-section.active {
            display: block;
        }

        /* Hero блок */
        .hero {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 40px 20px;
            text-align: center;
            border-radius: var(--border-radius);
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: 26px;
            margin-bottom: 12px;
        }

        .hero p {
            font-size: 15px;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: var(--white);
            padding: 12px 20px;
            border-radius: var(--border-radius);
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 15px;
            width: auto;
        }

        /* Категорії */
        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .category-card {
            background: var(--white);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .category-title {
            display: flex;
            align-items: center;
            gap: 10px;
            color: var(--primary-color);
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .category-list {
            list-style: none;
            padding-left: 5px;
        }

        .category-list li {
            font-size: 14px;
            padding: 4px 0;
            color: var(--text-dark);
        }

        /* Пошук та картки замовлень */
        .search-box {
            background: var(--white);
            padding: 15px;
            border-radius: var(--border-radius);
            margin-bottom: 20px;
            box-shadow: var(--shadow);
        }

        .input-control {
            width: 100%;
            padding: 10px;
            margin-bottom: 10px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .job-card {
            background: var(--white);
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            border-left: 5px solid var(--primary-color);
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 18px;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .job-price {
            color: var(--accent-color);
            white-space: nowrap;
        }

        .job-meta {
            font-size: 13px;
            color: var(--text-muted);
            margin-bottom: 10px;
        }

        /* Карта */
        .map-mock {
            height: 400px;
            background-color: #cbd5e0;
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #4a5568;
        }

        /* Форми */
        .form-container {
            background: var(--white);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .form-label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        /* Адаптивність */
        @media (max-width: 768px) {
            .desktop-nav { display: none; }
            .mobile-nav { display: flex; } /* Меню точно увімкнеться */
            .hero h1 { font-size: 22px; }
            .hero p { font-size: 14px; }
            .btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- Шапка для ПК -->
    <header>
        <div class="header-container">
            <a href="#" class="logo" onclick="switchPage('home')">Робота поруч</a>
            <nav>
                <ul class="desktop-nav">
                    <li><a class="nav-link active" onclick="switchPage('home')">Головна</a></li>
                    <li><a class="nav-link" onclick="switchPage('jobs')">Робота</a></li>
                    <li><a class="nav-link" onclick="switchPage('map')">Карта</a></li>
                    <li><a class="nav-link" onclick="switchPage('profile')">Профіль</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- СЕКЦІЯ 1: ГОЛОВНА -->
    <main id="home" class="page-section active">
        <div class="hero">
            <h1>Робота поруч.<br>Допомога поруч.<br>Люди поруч.</h1>
            <p>Знаходь роботу, замовляй послуги та знаходь виконавців у своєму районі.</p>
            <button class="btn" onclick="switchPage('jobs')">Знайти роботу</button>
        </div>

        <h2 style="margin-bottom: 15px; color: var(--primary-color);">Популярні категорії</h2>
        <div class="categories-grid">
            <div class="category-card">
                <div class="category-title">Ремонт та будівництво</div>
                <ul class="category-list">
                    <li>• Сантехнічні послуги</li>
                    <li>• Електрик терміново</li>
                    <li>• Складання меблів</li>
                </ul>
            </div>
