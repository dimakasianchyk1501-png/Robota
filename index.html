<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Робота поруч — Знайди роботу у своєму районі</title>
    <style>
        :root {
            --primary-color: #1b4d3e;
            --primary-light: #2c6b56;
            --accent-color: #e67e22;
            --bg-light: #f8f9fa;
            --text-dark: #2d3748;
            --text-muted: #718096;
            --white: #ffffff;
            --border-radius: 12px;
            --shadow: 0 4px 6px -1px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-dark);
            line-height: 1.5;
            padding-bottom: 95px; /* Захисний відступ для мобільного меню */
        }

        /* ШАПКА САЙТУ */
        header {
            background-color: var(--white);
            box-shadow: var(--shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .header-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            height: 65px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            color: var(--primary-color);
            text-decoration: none;
            cursor: pointer;
        }

        /* НАВІГАЦІЯ ДЛЯ ПК (ВГОРІ) */
        .desktop-nav {
            display: flex;
            gap: 10px;
            list-style: none;
        }

        .desktop-nav button {
            background: none;
            border: none;
            font-size: 15px;
            font-weight: 600;
            color: var(--text-dark);
            padding: 8px 14px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .desktop-nav button:hover {
            background-color: #f1f5f9;
        }

        .desktop-nav button.active {
            color: var(--primary-color);
            background-color: #edf2f7;
        }

        /* НАВІГАЦІЯ ДЛЯ МОБІЛЬНИХ (ЗНИЗУ) */
        .mobile-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background-color: var(--white);
            box-shadow: 0 -3px 15px rgba(0,0,0,0.12);
            display: none; /* Вмикається автоматично на смартфонах */
            justify-content: space-around;
            align-items: center;
            height: 75px;
            z-index: 99999;
            padding: 0 5px;
        }

        .mobile-nav-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            color: var(--text-muted);
            font-weight: bold;
            background: none;
            border: none;
            cursor: pointer;
            flex: 1;
            height: 100%;
        }

        .mobile-nav-item svg {
            width: 26px;
            height: 26px;
            margin-bottom: 3px;
            fill: var(--text-muted);
        }

        .mobile-nav-item.active {
            color: var(--primary-color);
        }

        .mobile-nav-item.active svg {
            fill: var(--primary-color);
        }

        /* Центральна кругла кнопка карти */
        .mobile-nav-item.center-btn {
            background-color: var(--accent-color);
            width: 56px;
            height: 56px;
            max-width: 56px;
            border-radius: 50%;
            position: relative;
            top: -15px;
            box-shadow: 0 4px 12px rgba(230, 126, 34, 0.35);
            flex: none;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .mobile-nav-item.center-btn svg {
            width: 26px;
            height: 26px;
            fill: var(--white);
            margin-bottom: 0;
        }

        /* СЕКЦІЇ СТОРІНОК */
        .page-section {
            display: none;
            padding: 25px 15px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .page-section.active {
            display: block !important;
        }

        /* Елементи контенту */
        .hero {
            background-color: var(--primary-color);
            color: var(--white);
            padding: 45px 20px;
            text-align: center;
            border-radius: var(--border-radius);
            margin-bottom: 30px;
        }

        .hero h1 {
            font-size: 26px;
            margin-bottom: 12px;
            line-height: 1.3;
        }

        .hero p {
            font-size: 14px;
            margin-bottom: 20px;
            opacity: 0.9;
        }

        .btn {
            display: inline-block;
            background-color: var(--accent-color);
            color: var(--white);
            padding: 12px 24px;
            border-radius: var(--border-radius);
            text-decoration: none;
            font-weight: bold;
            border: none;
            cursor: pointer;
            font-size: 15px;
        }

        .categories-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
            gap: 20px;
        }

        .category-card {
            background: var(--white);
            padding: 20px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
        }

        .category-title {
            color: var(--primary-color);
            font-size: 18px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .category-list {
            list-style: none;
        }

        .category-list li {
            font-size: 14px;
            padding: 5px 0;
            color: var(--text-dark);
            border-bottom: 1px solid #edf2f7;
        }
        .category-list li:last-child { border-bottom: none; }

        /* Блок пошуку вакансій */
        .search-box {
            background: var(--white);
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 25px;
            box-shadow: var(--shadow);
        }

        .input-control {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            border: 1px solid #cbd5e0;
            border-radius: 8px;
            font-size: 14px;
        }

        .job-card {
            background: var(--white);
            padding: 20px;
            border-radius: var(--border-radius);
            margin-bottom: 15px;
            box-shadow: var(--shadow);
            border-left: 5px solid var(--primary-color);
        }

        .job-header {
            display: flex;
            justify-content: space-between;
            font-weight: bold;
            font-size: 18px;
            color: var(--primary-color);
            margin-bottom: 8px;
        }

        .job-price { color: var(--accent-color); }
        .job-meta { font-size: 13px; color: var(--text-muted); margin-bottom: 10px; }

        /* Карта та форми */
        .map-mock {
            height: 380px;
            background-color: #cbd5e0;
            border-radius: var(--border-radius);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: #4a5568;
        }

        .form-container {
            background: var(--white);
            padding: 25px;
            border-radius: var(--border-radius);
            box-shadow: var(--shadow);
            max-width: 500px;
        }

        .form-label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
            font-size: 14px;
        }

        /* МЕДІА-ЗАПИТИ ДЛЯ СМАРТФОНІВ */
        @media (max-width: 768px) {
            .desktop-nav { display: none !important; }
            .mobile-nav { display: flex !important; }
            .hero h1 { font-size: 22px; }
            .search-box .btn, .hero .btn { width: 100%; text-align: center; }
        }
    </style>
</head>
<body>

    <!-- ВЕРХНЯ ШАПКА -->
    <header>
        <div class="header-container">
            <div class="logo" onclick="switchPage('home')">Робота поруч</div>
            <nav>
                <div class="desktop-nav">
                    <button class="pc-btn active" onclick="switchPage('home')">Головна</button>
                    <button class="pc-btn" onclick="switchPage('jobs')">Робота</button>
                    <button class="pc-btn" onclick="switchPage('map')">Карта</button>
                    <button class="pc-btn" onclick="switchPage('profile')">Профіль</button>
                </div>
            </nav>
        </div>
    </header>

    <!-- СЕКЦІЯ 1: ГОЛОВНА -->
    <main id="home" class="page-section active">
        <div class="hero">
            <h1>Робота поруч.<br>Допомога поруч.<br>Люди поруч.</h1>
            <p>Знаходь роботу, замовляй послуги та знаходь виконавців у своєму районі.</p>
            <button class="btn" onclick="switchPage('jobs')">Знайти роботу</button>
        </div>

        <h2 style="margin-bottom: 20px; color: var(--primary-color);">Популярні категорії</h2>
        <div class="categories-grid">
            <div class="category-card">
                <div class="category-title">Ремонт та будівництво</div>
                <ul class="category-list">
                    <li>• Сантехнічні послуги</li>
                    <li>• Електрик терміново</li>
                    <li>• Складання меблів</li>
                </ul>
            </div>
            <div class="category-card">
                <div class="category-title">Прибирання та побут</div>
